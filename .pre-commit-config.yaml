repos:
  - repo: builtin
    hooks:
      - id: trailing-whitespace
      - id: check-toml
      - id: end-of-file-fixer

  - repo: local
    hooks:
      - id: black
        name: Format with Black
        entry: uv run black
        language: system
        types: [python]

      - id: ruff
        name: Run ruff lints
        entry: uv run ruff
        language: system
        pass_filenames: false
        types: [python]
        args:
          - check
          - "--fix"
          - "taskiq_redis"
          - "tests"

      - id: mypy
        name: Validate types with MyPy
        entry: uv run mypy --show-traceback .
        language: system
        pass_filenames: false
        types: [ python ]
